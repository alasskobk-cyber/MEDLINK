name: Build MEDLINK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Télécharger MEDLINK
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier les versions
        run: |
          python --version
          java -version

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython==0.29.37"

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepter les licences Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Installer Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Nettoyer complètement Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construire MEDLINK
        env:
          P4A_PYTHON_VERSION: "3.12"
        run: |
          buildozer android debug

      - name: Vérifier l'APK
        run: |
          ls -lah bin/

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDLINK-APK
          path: bin/*.apk
